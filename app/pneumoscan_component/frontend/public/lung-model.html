import * as THREE from 'three';

const rimL = new THREE.DirectionalLight(0x8fd3da, 1.3); rimL.position.set(-4, 2, -5); scene.add(rimL);

  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.55)'); g.addColorStop(0.6, 'rgba(255,255,255,0.12)'); g.addColorStop(1, 'rgba(255,255,255,0)');

const TEX = radialTex();
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const root = new THREE.Group(); scene.add(root);

// ---------- Lungs ----------
const lungVert = `
varying vec3 vN; varying vec3 vV; varying vec3 vW;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const HEAT_MAX = 16;
const lungFrag = `
uniform float uTime, uOpacity, uSelPulse, uFocusOn, uFocusR, uFocusPulse, uScanOn, uScanY;
uniform vec3 uBase, uHover, uSelect, uFocusC;
uniform vec2 uRest;
uniform float uHeatOn;
uniform vec3 uHeatPoints[${HEAT_MAX}];
uniform float uHeatWeights[${HEAT_MAX}];
varying vec3 vN; varying vec3 vV; varying vec3 vW;
float band(vec3 b, float y){ return b.z * smoothstep(b.x - 0.035, b.x + 0.035, y) * (1.0 - smoothstep(b.y - 0.035, b.y + 0.035, y)); }
// Real per-pixel Grad-CAM cloud (docs/pneumoscan_redesign_plan.md's own "PneumoScan +
// Grad-CAM-in-3D" follow-up, owner-directed 2026-09-28): several real high-intensity
// points sampled client-side from the actual heatmap, each rendered as a soft gaussian
// splat -- extends the single-point "AI focus" glow above to an approximate continuous
// field, using the same distance-based falloff technique already proven by uFocusC/fz
// below, just summed over many points instead of one. Colors follow the identical jet
// ramp app/pneumoscan_component/frontend/src/viewer/heatmap.ts uses for the 2D overlay,
// so the 3D field reads as the same heatmap, not a different visualization.
vec3 jetColor(float t) {

  vec3 c1 = vec3(0.078, 0.471, 0.784);
  vec3 c2 = vec3(0.471, 0.824, 0.510);
  vec3 c3 = vec3(0.961, 0.784, 0.157);
  vec3 c4 = vec3(0.863, 0.157, 0.118);

  if (t < 0.5) return mix(c1, c2, (t - 0.25) / 0.25);

void main(){
  float y = (vW.y - uRest.x) / uRest.y;

  vec3 col = uBase * (0.5 + 0.95 * fres);
  float a = 0.035 + fres * 0.52;
  float sweep = exp(-pow((y + vW.x * 0.35 - (mod(uTime * 0.42, 5.2) - 2.4)) / 0.2, 2.0));
  col += vec3(0.55, 0.85, 0.9) * sweep * 0.32; a += sweep * 0.05;

  float sl = band(uSelect, y);

  col += vec3(0.5, 0.95, 1.0) * edge * 0.8;

  float fz = uFocusOn * exp(-d * d / (2.0 * uFocusR * uFocusR));
  float pulse = 0.85 + 0.15 * sin(uTime * 2.4) + uFocusPulse;
  col = mix(col, vec3(1.0, 0.64, 0.26), clamp(fz * 1.3, 0.0, 1.0));
  a += fz * 0.55 * pulse;
  float ring = uFocusOn * exp(-pow((d - uFocusR * 1.8) / 0.03, 2.0)) * (0.55 + 0.45 * sin(uTime * 2.4));
  col += vec3(1.0, 0.72, 0.35) * ring * 0.9; a += ring * 0.28;
  float heat = 0.0;
  for (int i = 0; i < ${HEAT_MAX}; i++) {
    float hd = distance(vW, uHeatPoints[i]);
    heat += uHeatWeights[i] * exp(-hd * hd / (2.0 * 0.16 * 0.16));
  }

  col = mix(col, jetColor(heat), heat * 0.8);
  a += heat * 0.55;
  float sc = uScanOn * exp(-pow((vW.y - uScanY) / 0.055, 2.0));
  col += vec3(0.45, 0.95, 1.0) * sc * 1.2; a += sc * 0.5;

}`;
function lungMat() {

    vertexShader: lungVert, fragmentShader: lungFrag, transparent: true, depthWrite: false, side: THREE.DoubleSide,

      uTime: { value: 0 }, uOpacity: { value: 1 }, uSelPulse: { value: 0 }, uFocusOn: { value: 0 }, uFocusR: { value: 0.28 }, uFocusPulse: { value: 0 },
      uScanOn: { value: 0 }, uScanY: { value: 0 }, uBase: { value: new THREE.Color(0x8fd0d6) }, uHover: { value: V(0, 0, 0) },
      uSelect: { value: V(0, 0, 0) }, uFocusC: { value: V(0, 0, 0) }, uRest: { value: new THREE.Vector2(0, 1) },
      uHeatOn: { value: 0 }, uHeatPoints: { value: Array.from({ length: HEAT_MAX }, () => V(0, 0, 0)) },
      uHeatWeights: { value: new Float32Array(HEAT_MAX) }
    }
  });
}
function lungGeometry(side) {
  const g = new THREE.SphereGeometry(1, 96, 72);
  const p = g.attributes.position, v = new THREE.Vector3();
  const s = side === 'right' ? -1 : 1;
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    let { x, y, z } = v;
    const t = (y + 1) / 2;
    const w = 1 - 0.5 * Math.pow(t, 2.4);
    x *= w; z *= (0.6 + 0.4 * (1 - Math.pow(t, 2.4)));

    if (m > 0.4) m = 0.4 + (m - 0.4) * 0.3;
    if (side === 'left' && m > 0 && z > -0.1) { const k = smooth(0.2, -0.1, y) * smooth(-0.95, -0.55, y) * smooth(-0.1, 0.4, z); m -= 0.22 * k; }

}
const LUNG = { right: { x: -0.74, sx: 0.66, sy: 1.16, sz: 0.8, y: -0.02 }, left: { x: 0.72, sx: 0.6, sy: 1.22, sz: 0.8, y: 0.02 } };
const lungs = {}, bounds = {};
for (const side of ['right', 'left']) {
  const d = LUNG[side];
  const mesh = new THREE.Mesh(lungGeometry(side), lungMat());
  mesh.name = side + '_lung'; mesh.position.set(d.x, d.y, 0); mesh.scale.set(d.sx, d.sy, d.sz);
  mesh.userData = { kind: 'lung', side }; mesh.renderOrder = 5;
  breath.add(mesh); lungs[side] = mesh;
}
scene.updateMatrixWorld(true);
for (const side of ['right', 'left']) bounds[side] = new THREE.Box3().setFromObject(lungs[side]);
function zoneRange(side, zone) {
  const b = bounds[side], h = b.max.y - b.min.y, i = { upper: 2, middle: 1, lower: 0 }[zone];
  const cuts = [b.min.y, b.min.y + h * 0.38, b.min.y + h * 0.68, b.max.y];

}

// Fissures (lobes)
const ray = new THREE.Raycaster();

const fissures = [];

  const runs = []; let cur = [];

    const th = k / 140 * Math.PI * 2;
    const d = e1.clone().multiplyScalar(Math.cos(th)).addScaledVector(e2, Math.sin(th)).normalize();
    ray.set(p0, d);

}
const OBL = { right: { p: V(LUNG.right.x, -0.1, 0), n: V(0, 1.2, 1.3).normalize() }, left: { p: V(LUNG.left.x, -0.05, 0), n: V(0, 1.1, 1.3).normalize() } };

// ---------- Airways ----------
const airMat = (o) => { const m = new THREE.MeshStandardMaterial({ color: 0xe4eef0, roughness: 0.38, metalness: 0.05, emissive: 0x4fc3ca, emissiveIntensity: 0.05, transparent: true, opacity: o }); m.userData.base = o; return m; };

const mats = { trachea: airMat(0.95), main: airMat(0.93), tree: airMat(0.85), ribs: boneMat(), spine: boneMat() };
mats.heart = new THREE.MeshStandardMaterial({ color: 0xc58f88, roughness: 0.55, transparent: true, opacity: 0.22, depthWrite: false, emissive: 0x6a2a24, emissiveIntensity: 0.15 }); mats.heart.userData.base = 0.22;

}
const carina = V(0, 0.55, 0.02);
tube(gTrachea, 'trachea', V(0, 1.95, 0.05), carina, 0.095, 0.09, mats.trachea);
for (let i = 0; i < 10; i++) {
  const r = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.012, 8, 32), mats.trachea);
  r.rotation.x = Math.PI / 2; r.position.set(0, 1.82 - i * 0.12, 0.05 - i * 0.003); r.userData = { kind: 'structure', id: 'trachea' };
  gTrachea.add(r); pickables.push(r);
}

tube(gMain, 'main', carina, hilumR, 0.075, 0.066, mats.main);
tube(gMain, 'main', carina, hilumL, 0.07, 0.06, mats.main);
branch(hilumR, V(-0.45, 1, 0.05).normalize(), 0.3, 0.05, 4);
branch(hilumR, V(-1, -0.2, 0.35).normalize(), 0.27, 0.045, 4);
branch(hilumR, V(-0.3, -1, -0.1).normalize(), 0.34, 0.054, 4);

branch(hilumL, V(0.3, -1, -0.12).normalize(), 0.36, 0.052, 4);

// ---------- Reference anatomy ----------
const heart = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), mats.heart);
heart.scale.set(0.5, 0.56, 0.42); heart.position.set(0.18, -0.52, 0.22); heart.rotation.z = -0.5;
heart.userData = { kind: 'structure', id: 'heart' }; heartG.add(heart); pickables.push(heart);
const RW = [0.55, 0.72, 0.85, 0.94, 1, 1.03, 1.03, 1.0, 0.95, 0.88];
for (let i = 0; i < 10; i++) {

    if (name !== lastName) { lastName = name; vname.textContent = name.toUpperCase(); parent.postMessage({ type: 'pneumoscan-lung-view', name }, '*'); }
  }
  renderer.render(scene, camera);
  if (!loadingGone) { const l = document.getElementById('loading'); l && l.remove(); loadingGone = true; }
}
renderer.setAnimationLoop(frame);
frame();
setInterval(() => { if (performance.now() - last > 120) frame(); }, 33);
</script>
