# OPT-6 — Streamlit demo interface config (CLAUDE.md section 16.1a). Not loaded
# via Hydra (Streamlit doesn't run under `hydra.main`) — loaded directly with
# OmegaConf at app startup (`app/streamlit_app.py`), so unlike this project's
# other documentation-mirror conf/ files, this one IS the actual source of these
# constants for the app, not a description of values hardcoded elsewhere.
#
# Every numeric policy value here already has a canonical source that this app
# reuses rather than re-decides: mc_dropout/deferral mirror Stage 19's DG-10
# (conf/experiment/uncertainty.yaml); ood mirrors OPT-5's own placeholder
# (conf/experiment/ood.yaml, itself explicitly NOT an owner-approved clinical
# policy the way DG-10 is).

paths:
  checkpoint_dir: outputs/checkpoints
  partition_path: data/partitions/hospitals_natural.json
  feature_cache_dir: data/feature_cache
  # Stage 9's cache assumes a frozen backbone -- invalid for fine_tune_last_block
  # checkpoints (round 9). scripts/build_feature_cache_finetuned.py builds this
  # separate cache from round 9's own backbone (docs/adr1_groupnorm_fallback.md §19).
  feature_cache_finetuned_dir: data/feature_cache_finetuned
  results_dir: outputs/results
  figures_dir: docs/figures

preprocessing:
  image_size: 224
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

mc_dropout:
  num_passes: 20 # T — matches Stage 19 / conf/experiment/uncertainty.yaml

deferral:
  target_defer_fraction: 0.10 # matches DG-10 (owner-approved 2026-08-30)

ood_detector:
  target_flag_fraction: 0.05 # matches OPT-5's placeholder (conf/experiment/ood.yaml)
  detector_seed: 42

# PneumoScan redesign (docs/pneumoscan_redesign_plan.md, owner-approved
# decision 3): the ONLY configuration the redesigned UI runs -- no model
# selector anywhere in it. Read by app/streamlit_app.py in place of the
# pre-redesign DEFAULT_CONFIG_KEY + Advanced-panel selectbox.
# Switched fedavg_secagg -> fedavg_dp_eps4 (2026-09-28, owner-directed):
# the original fedavg_secagg-only choice came from the Claude Design
# handoff's own mockup constraint, not a deliberate privacy/accuracy
# decision -- this project's actual thesis includes Differential Privacy,
# so the live public demo should show the DP-protected model, not the
# SecAgg-only one. Real cost of this switch vs. fedavg_secagg: AUROC
# 0.8194 -> 0.8085 (~1 point), ECE 0.0287 -> 0.1023 (DP is measurably
# worse-calibrated -- mitigated by this entry's own real temperature=2.2534
# recalibration above), ~13x more wall-clock per federated round during
# training (irrelevant to inference-time serving). See
# docs/results.md/docs/calibration.md for the full comparison.
active_configuration: fedavg_dp_eps4

# Real trained configurations only (CLAUDE.md's own governance: never expose an
# option the backend doesn't actually support) — every entry below has a real
# checkpoint on disk from Stage 21's ablation campaign, seed 42 (matching
# scripts/generate_explanations.py's existing precedent of one canonical
# checkpoint per configuration for demonstration purposes).
configurations:
  - key: fedavg_no_dp
    label: "FedAvg (no privacy protection)"
    checkpoint: outputs/checkpoints/ablation/fedavg_natural_seed42.pt
    description: "The federated global model — no Differential Privacy, no Secure Aggregation."
    privacy_preserving: false
    # Decision policy (docs/adr1_groupnorm_fallback.md §18, owner-directed
    # 2026-09-02) -- same methodology as round 9's own §10, applied to the
    # app's actual default checkpoint. decision_threshold: Youden's-J optimum
    # on val (sens=0.841, spec=0.680), replacing the previous implicit 0.5
    # (sens=0.787, spec=0.720) -- missed-pneumonia count drops 321->240 (25%
    # relative reduction) at a real specificity cost, mirroring round 9's own
    # tradeoff. abstention_half_width: 0.05 lands at 10.14% val abstention,
    # matching this project's existing DG-10 10%-deferral convention almost
    # exactly. temperature: fit on val (T=1.1402) -- unlike round 9, this
    # checkpoint genuinely is somewhat overconfident (softening helps here,
    # not sharpening): ECE improved 0.0207->0.0111, a real ~46% reduction.
    decision_threshold: 0.45
    abstention_half_width: 0.05
    temperature: 1.1402
  - key: fedavg_dp_eps1
    label: "FedAvg + DP (epsilon=1, strongest privacy)"
    checkpoint: outputs/checkpoints/ablation/dp_eps1.0_seed42.pt
    description: "Differential Privacy at the tightest budget in the sweep."
    privacy_preserving: true
  - key: fedavg_dp_eps2
    label: "FedAvg + DP (epsilon=2)"
    checkpoint: outputs/checkpoints/ablation/dp_eps2.0_seed42.pt
    description: "Differential Privacy, epsilon=2."
    privacy_preserving: true
  - key: fedavg_dp_eps4
    label: "FedAvg + DP (epsilon=4, default)"
    checkpoint: outputs/checkpoints/ablation/dp_eps4.0_seed42.pt
    description: "Differential Privacy at this project's pyproject.toml default epsilon."
    privacy_preserving: true
    # Decision policy (D1, scripts/derive_app_decision_policy.py, real
    # validation-set run 2026-09-28, owner-directed switch to make this the
    # deployed default). Real finding, not a tuning artifact: at the naive
    # 0.5 threshold this checkpoint is measurably biased toward "Normal"
    # (sensitivity only 44.7% on val), matching this project's own
    # documented DP-bias pattern (see streamlit_app.py's historical note on
    # dp_eps4_seed42's Hospital A behavior). decision_threshold=0.2 (best-F1
    # on the same 17-point 0.10-0.90 sweep every other checkpoint uses)
    # recovers sensitivity to 71.8% at a real specificity cost (87.6% ->
    # 73.3%) -- see outputs/results/fedavg_dp_eps4_threshold_calibration_analysis.json
    # for the full sweep. temperature=2.2534 is a large softening -- this
    # checkpoint is severely overconfident pre-calibration, consistent with
    # docs/calibration.md's own finding that DP causes a real ~4x ECE
    # increase over no-DP checkpoints.
    decision_threshold: 0.2
    temperature: 2.2534
    abstention_half_width: 0.05
    # D2 (scripts/precompute_app_deferral_ood.py, real validation-set run
    # 2026-09-28) -- same reasoning as fedavg_secagg's own entry: these
    # small precomputed artifacts (not the 576MB feature cache) give the
    # public Cloud deployment real deferral/OOD values instead of
    # permanent "Not available".
    deferral_threshold: 0.6728980541229248
    ood_artifacts_dir: outputs/app_artifacts/fedavg_dp_eps4
  - key: fedavg_dp_eps8
    label: "FedAvg + DP (epsilon=8, weakest privacy in sweep)"
    checkpoint: outputs/checkpoints/ablation/dp_eps8.0_seed42.pt
    description: "Differential Privacy at the loosest budget in the sweep."
    privacy_preserving: true
  - key: fedavg_secagg
    label: "FedAvg + Secure Aggregation"
    checkpoint: outputs/checkpoints/ablation/secagg_seed42.pt
    description: "No Differential Privacy, but the server never sees an individual hospital's update."
    privacy_preserving: false
    # Decision policy (D1, docs/pneumoscan_redesign_plan.md Phase 1A; derived
    # via scripts/derive_app_decision_policy.py, real validation-set run,
    # same methodology as docs/adr1_groupnorm_fallback.md sections 10/17).
    # decision_threshold: best-F1 point on the 17-point 0.10-0.90 sweep
    # (F1 0.638 at 0.55 vs. 0.624 at the naive 0.5 default).
    # temperature: fit on val (T=1.1283) -- softening, i.e. this checkpoint
    # is measurably overconfident pre-calibration (same direction as the
    # default fedavg_no_dp checkpoint, opposite of round 9's own mild
    # sharpening -- calibration direction is genuinely checkpoint-specific,
    # not a fixed property, matching this project's own prior finding).
    # abstention_half_width: real finding, not the target itself --
    # this checkpoint's predictive distribution clusters much more heavily
    # around the decision boundary than round 9's fine-tuned checkpoint does
    # (895+832 of 4844 val examples fall in the calibrated [0.5,0.7) range
    # alone). Every tested half-width in the standard sweep
    # {0.05,0.08,0.10,0.12,0.15,0.20} overshoots the project's own ~10%
    # deferral-target convention (DG-10) -- 0.05 (the smallest tested) is
    # the closest available point, but its REAL abstain rate is ~21.0%, not
    # ~10%. Kept the same fixed sweep set as round 9's own methodology
    # (section 10.4) rather than extending it ad hoc for this checkpoint
    # alone, to avoid the appearance of choosing whichever range produces a
    # nicer-looking number -- see
    # outputs/results/fedavg_secagg_threshold_calibration_analysis.json for
    # the full sweep.
    decision_threshold: 0.55
    temperature: 1.1283
    abstention_half_width: 0.05
    # D2 (docs/pneumoscan_redesign_plan.md Phase 1A; precomputed via
    # scripts/precompute_app_deferral_ood.py, real validation-set run):
    # deferral threshold + the 3 per-hospital OOD IsolationForest models
    # (outputs/app_artifacts/fedavg_secagg/, committed -- small, unlike the
    # 576MB feature cache calibrate_deferral_threshold/build_ood_detectors
    # need to compute these live, which Streamlit Cloud never has). This
    # gives the public deployment real "How sure is the AI"/"Image check"
    # values instead of permanently "Not available" there.
    deferral_threshold: 0.6906569600105286
    ood_artifacts_dir: outputs/app_artifacts/fedavg_secagg
  - key: centralized
    label: "Centralized (privacy-free ceiling — comparison only)"
    checkpoint: outputs/checkpoints/centralized_baseline/natural_seed42.pt
    description: "NOT privacy-preserving. Pooled training, shown only as the upper-bound comparison point."
    privacy_preserving: false
  - key: fedavg_finetune_pilot
    label: "FedAvg + fine-tuned last block (ADR-1 GroupNorm fallback — this app's default)"
    checkpoint: outputs/checkpoints/finetuned/fedavg_natural_seed42.pt
    description: "Now the app's default (CLAUDE.md resolved decision 15, 2026-09-26): denseblock4+norm5 unfrozen and fine-tuned under real FedAvg, 10 rounds, round 9 selected by pooled val AUROC. This is seed 42 of a real 3-seed campaign (docs/results.md's row 3, AUROC 0.8651±0.0101) -- no longer single-seed pilot evidence, though still not yet run under DP/SecAgg. Deferral and OOD checks are unavailable for this checkpoint (Stage 9's calibration cache assumes a frozen backbone, invalid here) — do not treat their absence as those checks passing."
    privacy_preserving: false
    fine_tune_last_block: true
    # Decision policy (docs/adr1_groupnorm_fallback.md §10, owner-directed
    # 2026-09-01) -- derived from round 9's own real validation set, never the
    # test set. decision_threshold: Youden's-J / best-F1 operating point
    # (sens=0.825, spec=0.739 on val), replacing the previous implicit 0.5
    # (sens=0.747, spec=0.788) -- strictly better on sensitivity/F1, a real
    # specificity cost, a clinically deliberate tradeoff, not a default.
    # abstention_half_width: band around that threshold where the calibrated
    # P(pneumonia) is treated as "Uncertain" rather than forced to a class --
    # 0.05 was chosen as the closest tested width to this project's own
    # existing 10% deferral-target convention (DG-10), landing at 9.6% val
    # abstention. temperature: fit via src.uncertainty.probability_calibration
    # on val (T=0.9349) -- a mild sharpening (T<1), not softening; kept because
    # it measurably improved ECE (0.0155->0.0129) on val, not because it
    # addresses overconfidence (it doesn't -- see the module docstring).
    decision_threshold: 0.45
    abstention_half_width: 0.05
    temperature: 0.9349
