# Stage 16 — TLS + client authentication (ADR-4).
#
# This is documentation, not something `flwr` reads — at the pinned flwr==1.35.0,
# TLS and node-authentication settings are CLI flags to `flower-superlink`/
# `flower-supernode` and entries in the user-level `~/.flwr/config.toml` SuperLink
# connection registry, not `[tool.flwr.app.config]` keys the app code consumes (see
# `docs/SESSION_STATE.md`'s Stage 16 note for exactly why and the full command
# sequence). This file exists so the settings are documented alongside every other
# stage's config per this project's Hydra convention, even though nothing loads it.

certs_dir: certs # gitignored — generated by scripts/generate_certs.sh, never committed

# SuperLink (server) TLS — encrypts the channel and authenticates the server to
# every client. Required (not optional) for SuperNode authentication to be enabled
# at all (flwr==1.35.0 refuses --enable-supernode-auth with --insecure).
ssl_ca_certfile: certs/ca.crt
ssl_certfile: certs/server.pem
ssl_keyfile: certs/server.key

# Client (SuperNode) authentication — ADR-4's "confirming an update came from a
# registered hospital." Flower's node-authentication mechanism (ECDSA-384 keypairs,
# OpenSSH format), verified against the pinned CLI, not the old --auth-list-public-keys
# flag (removed at this version, hard error if passed).
enable_supernode_auth: true
hospitals:
  A: { private_key: certs/hospital_A, public_key: certs/hospital_A.pub }
  B: { private_key: certs/hospital_B, public_key: certs/hospital_B.pub }
  C: { private_key: certs/hospital_C, public_key: certs/hospital_C.pub }

# gRPC message length — ADR-4's original text assumes Flower's old 4MB default,
# requiring explicit override. Verified stale for flwr==1.35.0: no CLI override
# exists any more; flwr.common.GRPC_MAX_MESSAGE_LENGTH is a hardcoded ~2GB constant.
# The real requirement (payload comfortably fits) is verified in
# src/federated/security.py / tests/test_security.py instead of configured here.
grpc_max_message_length_bytes: 2147483647 # flwr.common.GRPC_MAX_MESSAGE_LENGTH, informational only

# Deployment-engine ports (distinct from the simulation runtime, which has no real
# network and cannot exercise TLS/auth at all).
fleet_api_address: "127.0.0.1:9092"
control_api_address: "127.0.0.1:9093"
