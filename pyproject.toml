[project]
name = "privacy-preserving-medical-diagnosis"
version = "0.1.0"
description = "Privacy-preserving pneumonia detection via federated learning, differential privacy and secure aggregation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "flwr==1.35.0",
    "opacus==1.6.0",
    "opencv-python-headless==5.0.0.93",
    "hydra-core==1.3.5",
    "omegaconf==2.3.1",
    "mlflow==3.15.2",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "pydicom==3.0.2",
    "pillow==12.3.0",
    "tqdm==4.70.0",
    "matplotlib==3.11.1",
    "grad-cam==1.5.7",
    "kaggle==2.2.4",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
