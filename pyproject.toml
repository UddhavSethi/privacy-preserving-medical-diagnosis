[project]
# Shortened from "privacy-preserving-medical-diagnosis" (37 chars) — Flower's
# [tool.flwr.app] validator hard-requires [project].name to be <=32 chars (it's
# reused as the Flower App name), with no override available. Purely cosmetic: this
# name isn't imported anywhere (all imports go through `src.*`) and doesn't affect
# the project's stated identity in CLAUDE.md or the repo name. Matches the MLflow
# experiment_name already used in conf/config.yaml.
name = "pneumonia-fl"
version = "0.1.0"
description = "Privacy-preserving pneumonia detection via federated learning, differential privacy and secure aggregation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "flwr[simulation]==1.35.0",
    "opacus==1.6.0",
    "opencv-python-headless==5.0.0.93",
    "hydra-core==1.3.5",
    "omegaconf==2.3.1",
    "mlflow==3.15.2",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "pydicom==3.0.2",
    "pillow==12.3.0",
    "tqdm==4.70.0",
    "matplotlib==3.11.1",
    "grad-cam==1.5.7",
    "kaggle==2.2.4",
    "requests==2.34.2",
    "streamlit==1.62.0",  # OPT-6 — approved 2026-08-30. Presentation-only demo
    # layer (app/); never imported by src/ or tests other than the app's own
    # inference-wrapper smoke test. Pulls in altair/pydeck/python-multipart/
    # toml/watchdog and a websockets 17.1->16.1.1 downgrade (nothing else in
    # this project pins websockets directly).
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flwr.app]
publisher = "uddhavsethi"
# fab-format-version intentionally omitted (defaults to 0) — version 1 requires a
# declared [project].license file, and picking a real license is a project-owner
# decision outside this stage's scope, not something to invent unilaterally to
# satisfy a local CLI validator.
flwr-version-target = "1.35.0"
# Positive allowlist rather than relying on excludes: the FAB bundle only needs the
# source code + pyproject.toml. Excludes alone weren't sufficient — .venv's installed
# packages (torch, pandas, mlflow, etc. ship some very large .py/.json/.yaml files,
# ~350MB total) and data/*.json (partition files, several MB each) both matched
# Flower's default *.py/*.json/etc. include patterns and pushed the bundle over the
# 10MB FAB limit. (Must be a direct key of [tool.flwr.app], not nested under
# [tool.flwr.app.components] — a misplacement that silently no-opped the first time.)
fab-include = ["src/**/*.py", "pyproject.toml"]

[tool.flwr.app.components]
serverapp = "src.federated.server_app:app"
clientapp = "src.federated.client_app:app"

[tool.flwr.app.config]
# Stage 13 — FedAvg, no privacy layers. Mirrored (documentation-only) in
# conf/federated/fedavg.yaml; this section is what `flwr run` actually reads.
#
# partition-path / feature-cache-dir / output-checkpoint are ABSOLUTE paths,
# deliberately, not relative — Flower's simulation runtime copies the app's source
# into an isolated directory (~/.flwr/apps/...) and executes it from there, so a
# relative path (or a Path(__file__)-derived "repo root", as other scripts in this
# project use) silently resolves against the wrong directory. This is a known,
# machine-specific limitation of running Stage 13 via `flwr run` locally; Stage 17's
# deployment engine is a different execution mode with its own config and will need
# its own path handling, not this one.
partition-path = "/mnt/storage/pneumonia-detection/data/partitions/hospitals_natural.json"
feature-cache-dir = "/mnt/storage/pneumonia-detection/data/feature_cache"
# clahe-cache-dir: added 2026-08-31 for the ADR-1 GroupNorm fallback pilot's
# federated app pair (client_app_finetune.py/server_app_finetune.py) -- those
# train on raw CLAHE-cached images (a partially-unfrozen backbone invalidates
# Stage 9's pooled-feature cache), unlike the canonical app above which never
# reads this key. Declared here (not only passed via --run-config) because
# Flower rejects a --run-config override for any key not already declared in
# this file (see scripts/run_ablation.py's own note on this).
clahe-cache-dir = "/mnt/storage/pneumonia-detection/data/clahe_cache"
output-checkpoint = "/mnt/storage/pneumonia-detection/outputs/checkpoints/federated/fedavg_final.pt"
num-server-rounds = 20
local-epochs = 1
learning-rate = 0.001
batch-size = 32
fraction-evaluate = 1.0
seed = 42

# Stage 14 — Differential Privacy (ADR-2), config-switchable. Default OFF: Stage 13's
# verified-working FedAvg-without-DP path is unaffected unless dp-enabled is
# explicitly overridden (`--run-config "dp-enabled=true"`). DG-7 (owner-approved
# 2026-08-29): target epsilon sweep {1, 2, 4, 8}, delta=1e-5 (standard for
# datasets in the thousands-to-tens-of-thousands range, and well below 1/N for every
# hospital — smallest is Hospital A at N=4,180 train, so 1/N~=2.4e-4 >> 1e-5).
# target-epsilon below is the sweep's midpoint (4), used as the config default;
# override per run for the other sweep values.
dp-enabled = false
target-epsilon = 4.0
target-delta = 0.00001
max-grad-norm = 1.0

# Stage 15 — Secure Aggregation (ADR-3, ablation row 4). Only consumed when
# [tool.flwr.app.components] is temporarily pointed at
# src.federated.server_app_secagg:app / client_app_secagg:app instead of the
# canonical app above — SecAgg+ at flwr==1.35.0 only integrates via Flower's
# legacy Strategy/workflow API, which is a structurally different ServerApp
# construction, not a runtime flag (see server_app_secagg.py's docstring).
# num_shares=3/reconstruction_threshold=2: all 3 hospitals share key pieces,
# any 2 of 3 can reconstruct — tolerates 1 client dropout, the protocol's
# natural minimum non-trivial setting for a fixed 3-client project.
num-shares = 3
reconstruction-threshold = 2
# max-weight must exceed every hospital's train-set size (SecAggPlusWorkflow's
# own default is 1000.0, far below this project's real per-hospital counts —
# Hospital B/C's natural shards are ~13,342 train each — which triggers its
# "potential overflow" warning in the weight-encoding math every round;
# found via the Stage 15 live validation run, not by inspection). 20000 gives
# headroom above the largest hospital with room to spare for future partitions.
max-weight = 20000

# Stage 16 — TLS + client authentication (ADR-4). Targets a locally-run
# deployment-engine SuperLink (`flower-superlink`), not the simulation runtime
# used by every prior stage's `--federation-config "num-supernodes=N"` — the
# simulation runtime has no real network connections, so TLS/node auth cannot
# be exercised through it at all (confirmed by the SuperLink's own runtime
# warning). At flwr==1.35.0 the SuperLink target is resolved through a named
# connection in the user-level `~/.flwr/config.toml` (the same registry
# `flwr supernode register` reads), NOT a `[tool.flwr.federations.X]` block
# here — defining both under the same name triggers a "legacy TOML
# migration" conflict and `flwr run` fails outright (found via this stage's
# own live validation, not by inspection). Run with `flwr run . deployment`
# after `scripts/generate_certs.sh`, after adding a `[superlink.deployment]`
# entry to `~/.flwr/config.toml` (see `docs/SESSION_STATE.md`'s Stage 16
# note for the exact entry), and after registering each hospital's public
# key (`flwr supernode register certs/hospital_A.pub deployment`, etc.)
# against a SuperLink started with `--enable-supernode-auth` + TLS.

# Stage 21 — MLflow tracking for federated runs (CLAUDE.md section 12: "a result
# that is not in MLflow does not exist"). Must be an ABSOLUTE sqlite path — Flower's
# simulation runtime executes server_app.py from an isolated copy of the app
# (~/.flwr/apps/<hash>/), so a relative path here would silently create a
# disconnected mlruns.db there instead of the project's real one. Set by default so
# every `flwr run` from here on is tracked automatically, not just Stage 21's
# campaign runs — server_app.py treats it as fully optional (`nullcontext` if unset)
# purely so a future run can still disable it via `--run-config` if ever needed.
# The per-run name (not a config key — see server_app.py's own comment on why)
# is derived from seed/dp/epsilon/partition-path, which scripts/run_ablation.py
# already varies per invocation via --run-config overrides.
mlflow-tracking-uri = "sqlite:////mnt/storage/pneumonia-detection/mlruns.db"
mlflow-experiment-name = "federated_ablation"
